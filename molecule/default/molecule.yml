---
driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:latest
    dockerfile: Dockerfile-ubuntu.j2
    privileged: true
    command: /sbin/init
    tty: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    env:
      container: docker

  - name: oraclelinux8
    image: oraclelinux:8
    privileged: true
    command: /sbin/init
    tty: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    env:
      container: docker

ansible:
  playbooks:
    converge: converge.yml
    verify: verify.yml

scenario:
  name: default
