---
- name: Download Vector
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp/vector-{{ vector_version }}.tar.gz"
    mode: "0644"

- name: Create Vector directory
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    mode: "0755"

- name: Unarchive Vector
  ansible.builtin.unarchive:
    src: "/tmp/vector-{{ vector_version }}.tar.gz"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=2
    creates: "{{ vector_install_dir }}/bin/vector"

- name: Create Vector user
  ansible.builtin.user:
    name: "{{ vector_user }}"
    system: true
    create_home: false

- name: Create Vector config directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_user }}"
    mode: "0755"

- name: Create Vector data directory
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_user }}"
    mode: "0755"

- name: Create Vector binary link
  ansible.builtin.file:
    src: "{{ vector_install_dir }}/bin/vector"
    dest: /usr/bin/vector
    state: link

- name: Install Vector systemd service
  ansible.builtin.copy:
    src: "{{ vector_install_dir }}/etc/systemd/vector.service"
    dest: /etc/systemd/system/vector.service
    remote_src: true
    mode: "0644"

- name: Deploy Vector config
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: "{{ vector_user }}"
    group: "{{ vector_user }}"
    mode: "0644"
  notify: Restart Vector

- name: Start Vector service
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
    daemon_reload: true